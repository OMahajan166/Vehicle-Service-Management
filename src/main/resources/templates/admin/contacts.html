<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact Messages</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 <span>AutoCare</span> Admin</div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/customers">Customers</a></li>
            <li><a href="/admin/mechanics">Mechanics</a></li>
            <li><a href="/admin/services">Services</a></li>
            <li><a href="/admin/bills">Bills</a></li>
            <li><a href="/admin/generate-bill">Generate Bill</a></li>
            <li><a href="/admin/reports">Reports</a></li>
            <li><a href="/admin/contacts">Contacts</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="dashboard-container">

    <h1>Contact Messages</h1>

    <table class="table">

        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Message</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="contact : ${contacts}">
            <td th:text="${contact.name}"></td>
            <td th:text="${contact.email}"></td>
            <td th:text="${contact.phone}"></td>
            <td th:text="${contact.message}"></td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
