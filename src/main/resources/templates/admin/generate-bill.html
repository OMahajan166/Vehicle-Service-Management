<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generate Bill</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 <span>AutoCare</span> Admin</div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/customers">Customers</a></li>
            <li><a href="/admin/mechanics">Mechanics</a></li>
            <li><a href="/admin/services">Services</a></li>
            <li><a href="/admin/bills">Bills</a></li>
            <li><a href="/admin/generate-bill">Generate Bill</a></li>
            <li><a href="/admin/reports">Reports</a></li>
            <li><a href="/admin/contacts">Contacts</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="form-container">

    <h1>Generate Bill</h1>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:action="@{/admin/generate-bill}"
          th:object="${bill}"
          method="post">

        <div class="form-group">
            <label>Service ID</label>
            <select th:field="*{serviceId}" required>
                <option value="">Select Service</option>

                <option
                        th:each="service : ${services}"
                        th:value="${service.id}"
                        th:text="${service.id + ' - ' + service.serviceType}">
                </option>
            </select>
        </div>

        <!-- Customer is taken automatically from the selected service -->

        <div class="form-group">
            <label>Labor Cost</label>
            <input type="number"
                   step="0.01"
                   th:field="*{laborCost}"
                   required>
        </div>

        <div class="form-group">
            <label>Spare Parts Cost</label>
            <input type="number"
                   step="0.01"
                   th:field="*{spareParts}"
                   required>
        </div>

        <div class="form-group">
            <label>Tax</label>
            <input type="number"
                   step="0.01"
                   th:field="*{tax}"
                   required>
        </div>

        <button class="btn-submit">
            Generate Bill
        </button>

    </form>

</div>

</body>
</html>
