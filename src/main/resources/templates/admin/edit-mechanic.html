<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Mechanic</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 <span>AutoCare</span> Admin</div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/customers">Customers</a></li>
            <li><a href="/admin/mechanics">Mechanics</a></li>
            <li><a href="/admin/services">Services</a></li>
            <li><a href="/admin/bills">Bills</a></li>
            <li><a href="/admin/generate-bill">Generate Bill</a></li>
            <li><a href="/admin/reports">Reports</a></li>
            <li><a href="/admin/contacts">Contacts</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="form-container">

    <h1>Edit Mechanic</h1>

    <form th:action="@{/admin/edit-mechanic/{id}(id=${mechanic.id})}"
          th:object="${mechanic}"
          method="post">

        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Name"
                   th:field="*{name}" required>
        </div>

        <div class="form-group">
            <label for="specialization">Specialization</label>
            <input type="text" id="specialization" placeholder="Specialization"
                   th:field="*{specialization}" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="Phone"
                   th:field="*{phone}" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Email"
                   th:field="*{email}" required>
        </div>

        <div class="form-group">
            <label for="experience">Experience</label>
            <input type="text" id="experience" placeholder="Experience"
                   th:field="*{experience}" required>
        </div>

        <div class="form-group">
            <label for="newPassword">Reset Login Password (leave blank to keep current)</label>
            <input type="password" id="newPassword" name="newPassword" minlength="6"
                   placeholder="New password">
        </div>

        <button type="submit" class="btn-submit">
            Update Mechanic
        </button>

        <a href="/admin/mechanics" class="btn-cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
