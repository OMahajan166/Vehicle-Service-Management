<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 <span>AutoCare</span> Admin</div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard">Dashboard</a></li>
            <li><a href="/admin/customers">Customers</a></li>
            <li><a href="/admin/mechanics">Mechanics</a></li>
            <li><a href="/admin/services">Services</a></li>
            <li><a href="/admin/bills">Bills</a></li>
            <li><a href="/admin/generate-bill">Generate Bill</a></li>
            <li><a href="/admin/reports">Reports</a></li>
            <li><a href="/admin/contacts">Contacts</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="dashboard-container">

    <h1>Customers</h1>

    <form method="get" th:action="@{/admin/customers}" style="margin:16px 0;">
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="Search by name, email or phone" style="padding:8px;min-width:280px;">
        <button type="submit" class="btn-submit">🔍 Search</button>
        <a th:if="${keyword}" th:href="@{/admin/customers}" class="btn-cancel">Clear</a>
    </form>

    <p th:if="${keyword}">
        Showing <strong th:text="${#lists.size(customers)}"></strong> result(s)
        for "<span th:text="${keyword}"></span>"
    </p>

    <div th:if="${customers.isEmpty()}"
         class="empty-state">

        <span th:if="${keyword}">No customers match your search.</span>
        <span th:unless="${keyword}">No customers registered.</span>
    </div>

    <table class="table"
           th:unless="${customers.isEmpty()}">

        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="customer : ${customers}">

            <td th:text="${customer.id}"></td>

            <td th:text="${customer.name}"></td>

            <td th:text="${customer.email}"></td>

            <td th:text="${customer.phone}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
