<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Register - Vehicle Service Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li>
                <a href="/auth/login"
                   class="btn-login">
                    Login
                </a>
            </li>
        </ul>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">

        <h1>Create Your Account</h1>

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">
        </div>

        <form th:action="@{/auth/register}"
              th:object="${user}"
              method="post">

            <!-- Name -->
            <div class="form-group">
                <label>Full Name</label>

                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter your name">

                <small style="color:red"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}">
                </small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email</label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter your email">

                <small style="color:red"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">
                </small>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label>Phone Number</label>

                <input type="text"
                       th:field="*{phone}"
                       placeholder="Enter your phone number">

                <small style="color:red"
                       th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}">
                </small>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>

                <input type="password"
                       th:field="*{password}"
                       placeholder="Minimum 6 characters">

                <small style="color:red"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                </small>
            </div>

            <button type="submit"
                    class="btn-submit">
                Register
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="/auth/login">
                Login here
            </a>
        </p>

    </div>
</div>

</body>
</html>
