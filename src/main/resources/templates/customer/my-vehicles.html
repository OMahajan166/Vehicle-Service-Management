<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Vehicles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>

        <ul class="nav-links">
            <li><a href="/customer/dashboard">Dashboard</a></li>
            <li><a href="/customer/book-service">Book Service</a></li>
            <li><a href="/customer/vehicles">My Vehicles</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="dashboard-container">

    <h1>My Vehicles</h1>

    <div th:if="${success}" class="success-message" th:text="${success}"></div>
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <a href="/customer/add-vehicle" class="action-btn">
        ➕ Add New Vehicle
    </a>

    <br><br>

    <div th:if="${vehicles.isEmpty()}" class="empty-state">
        <h2>No Vehicles Found</h2>
        <p>You haven't added any vehicles yet.</p>
    </div>

    <table class="table" th:unless="${vehicles.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Vehicle Number</th>
            <th>Company</th>
            <th>Model</th>
            <th>Fuel Type</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="vehicle : ${vehicles}">
            <td th:text="${vehicle.id}"></td>
            <td th:text="${vehicle.vehicleNumber}"></td>
            <td th:text="${vehicle.company}"></td>
            <td th:text="${vehicle.model}"></td>
            <td th:text="${vehicle.fuelType}"></td>
            <td>
                <a th:href="@{/customer/edit-vehicle/{id}(id=${vehicle.id})}"
                   class="link">Edit</a>
                <form th:action="@{/customer/delete-vehicle/{id}(id=${vehicle.id})}"
                      method="post" style="display:inline;"
                      onsubmit="return confirm('Delete this vehicle? This cannot be undone.');">
                    <button type="submit" class="link"
                            style="background:none;border:none;color:#dc3545;cursor:pointer;padding:0;">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
