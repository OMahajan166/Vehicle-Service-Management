<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bills</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>

        <ul class="nav-links">
            <li><a href="/customer/dashboard">Dashboard</a></li>
            <li><a href="/customer/services">My Services</a></li>
            <li><a href="/customer/bills">My Bills</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="dashboard-container">

    <h1>My Bills</h1>

    <div th:if="${bills.isEmpty()}" class="empty-state">
        <h2>No Bills Available</h2>
        <p>Your bills will appear here once generated by the admin.</p>
    </div>

    <table class="table" th:unless="${bills.isEmpty()}">

        <thead>
        <tr>
            <th>Bill ID</th>
            <th>Service ID</th>
            <th>Total Amount</th>
            <th>Status</th>
            <th>Created On</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="bill : ${bills}">
            <td th:text="${bill.id}"></td>
            <td th:text="${bill.serviceId}"></td>
            <td th:text="'₹' + ${bill.totalAmount}"></td>

            <td>
                <span class="status"
                      th:classappend="${bill.status == 'Paid' ? 'completed' : 'pending'}"
                      th:text="${bill.status}">
                </span>
            </td>

            <td th:text="${#temporals.format(bill.createdAt,'dd-MM-yyyy HH:mm')}"></td>

            <td>
                <a th:href="@{/customer/bill/{id}(id=${bill.id})}"
                   class="link">
                    View
                </a>
            </td>
        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
