<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🚗 AutoCare Services</div>
            <ul class="nav-links">
                <li><a href="/customer/dashboard">Dashboard</a></li>
                <li><a href="/customer/vehicles">My Vehicles</a></li>
                <li><a href="/auth/logout" class="btn-logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <h1>Add a New Vehicle</h1>
        
        <form th:action="@{/customer/add-vehicle}" th:object="${vehicle}" method="POST">
            <div class="form-group">
                <label for="vehicleNumber">Vehicle Number:</label>
                <input type="text" id="vehicleNumber" th:field="*{vehicleNumber}" placeholder="e.g., ABC123XYZ" required>
            </div>
            
            <div class="form-group">
                <label for="company">Vehicle Company:</label>
                <input type="text" id="company" th:field="*{company}" placeholder="e.g., Toyota" required>
            </div>
            
            <div class="form-group">
                <label for="model">Vehicle Model:</label>
                <input type="text" id="model" th:field="*{model}" placeholder="e.g., Fortuner" required>
            </div>
            
            <div class="form-group">
                <label for="fuelType">Fuel Type:</label>
                <select id="fuelType" th:field="*{fuelType}" required>
                    <option value="">Select Fuel Type</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                    <option value="Electric">Electric</option>
                </select>
            </div>
            
            <button type="submit" class="btn-submit">Add Vehicle</button>
            <a href="/customer/vehicles" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
