<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Book Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>

        <ul class="nav-links">
            <li><a href="/customer/dashboard">Dashboard</a></li>
            <li><a href="/customer/book-service">Book Service</a></li>
            <li><a href="/logout"
                   class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="form-container">

    <h1>Book a Service</h1>

    <form th:action="@{/customer/book-service}"
          th:object="${service}"
          method="POST">

        <!-- Vehicle -->
        <div class="form-group">
            <label>Select Vehicle:</label>

            <select th:field="*{vehicleId}">
                <option value="">
                    Choose a vehicle
                </option>

                <option
                        th:each="vehicle : ${vehicles}"
                        th:value="${vehicle.id}"
                        th:text="${vehicle.vehicleNumber + ' - ' +
                                  vehicle.company + ' ' +
                                  vehicle.model}">
                </option>
            </select>
        </div>

        <!-- Service Type -->
        <div class="form-group">
            <label>Service Type:</label>

            <select th:field="*{serviceType}">
                <option value="">
                    Select Service Type
                </option>

                <option value="Oil Change">
                    Oil Change
                </option>

                <option value="Car Washing">
                    Car Washing
                </option>

                <option value="Engine Repair">
                    Engine Repair
                </option>

                <option value="Tire Replacement">
                    Tire Replacement
                </option>

                <option value="Battery Service">
                    Battery Service
                </option>

                <option value="Brake Service">
                    Brake Service
                </option>

                <option value="General Checkup">
                    General Checkup
                </option>
            </select>

            <small style="color:red"
                   th:if="${#fields.hasErrors('serviceType')}"
                   th:errors="*{serviceType}">
            </small>
        </div>

        <!-- Service Date -->
        <div class="form-group">
            <label>Preferred Date:</label>

            <input type="date"
                   th:field="*{serviceDate}">

            <small style="color:red"
                   th:if="${#fields.hasErrors('serviceDate')}"
                   th:errors="*{serviceDate}">
            </small>
        </div>

        <!-- Description -->
        <div class="form-group">
            <label>Problem Description:</label>

            <textarea th:field="*{description}"
                      rows="4">
            </textarea>

            <small style="color:red"
                   th:if="${#fields.hasErrors('description')}"
                   th:errors="*{description}">
            </small>
        </div>

        <button type="submit"
                class="btn-submit">
            Book Service
        </button>

        <a href="/customer/dashboard"
           class="btn-cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
