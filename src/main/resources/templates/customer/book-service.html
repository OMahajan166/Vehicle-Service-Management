<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">🚗 AutoCare Services</div>
            <ul class="nav-links">
                <li><a href="/customer/dashboard">Dashboard</a></li>
                <li><a href="/customer/book-service">Book Service</a></li>
                <li><a href="/auth/logout" class="btn-logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <h1>Book a Service</h1>
        
        <form th:action="@{/customer/book-service}" th:object="${service}" method="POST">
            <div class="form-group">
                <label for="vehicleId">Select Vehicle:</label>
                <select id="vehicleId" th:field="*{vehicleId}" required>
                    <option value="">Choose a vehicle</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.vehicleNumber + ' - ' + vehicle.company + ' ' + vehicle.model}"></option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="serviceType">Service Type:</label>
                <select id="serviceType" th:field="*{serviceType}" required>
                    <option value="">Select Service Type</option>
                    <option value="Oil Change">Oil Change - ₹49</option>
                    <option value="Car Washing">Car Washing - ₹39</option>
                    <option value="Engine Repair">Engine Repair - ₹99</option>
                    <option value="Tire Replacement">Tire Replacement - ₹149</option>
                    <option value="Battery Service">Battery Service - ₹79</option>
                    <option value="Brake Service">Brake Service - ₹89</option>
                    <option value="General Checkup">General Checkup</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="serviceDate">Preferred Date:</label>
                <input type="date" id="serviceDate" th:field="*{serviceDate}" required>
            </div>
            
            <div class="form-group">
                <label for="description">Problem Description:</label>
                <textarea id="description" th:field="*{description}" rows="4" placeholder="Describe the issue with your vehicle" required></textarea>
            </div>
            
            <button type="submit" class="btn-submit">Book Service</button>
            <a href="/customer/dashboard" class="btn-cancel">Cancel</a>
        </form>
    </div>
</body>
</html>
