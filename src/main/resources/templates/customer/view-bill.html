<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bill Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>

        <ul class="nav-links">
            <li><a href="/customer/dashboard">Dashboard</a></li>
            <li><a href="/customer/bills">My Bills</a></li>
            <li><a href="/logout" class="btn-logout">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="form-container">

    <div class="service-card" th:if="${bill}">

        <div th:if="${success}" class="success-message" th:text="${success}"></div>
        <div th:if="${error}" class="error-message" th:text="${error}"></div>

        <h1>Invoice</h1>

        <div class="service-details">

            <p><strong>Bill ID :</strong>
                <span th:text="${bill.id}"></span></p>

            <p><strong>Service ID :</strong>
                <span th:text="${bill.serviceId}"></span></p>

            <p><strong>Labor Cost :</strong>
                ₹<span th:text="${bill.laborCost}"></span></p>

            <p><strong>Spare Parts :</strong>
                ₹<span th:text="${bill.spareParts}"></span></p>

            <p><strong>Tax :</strong>
                ₹<span th:text="${bill.tax}"></span></p>

            <hr>

            <h2>
                Total :
                ₹<span th:text="${bill.totalAmount}"></span>
            </h2>

            <p>
                <strong>Status :</strong>
                <span class="status" th:classappend="${bill.status == 'Paid' ? 'completed' : 'pending'}" th:text="${bill.status}"></span>
            </p>

            <p th:if="${bill.status == 'Paid'}">
                <strong>Paid Via :</strong>
                <span th:text="${bill.paymentMethod}"></span>
                <span th:if="${bill.paidAt}">
                    on <span th:text="${#temporals.format(bill.paidAt,'dd-MM-yyyy HH:mm')}"></span>
                </span>
            </p>

        </div>

        <!-- Pay now (simulated payment) -->
        <form th:if="${bill.status != 'Paid'}"
              th:action="@{/customer/bill/{id}/pay(id=${bill.id})}"
              method="post"
              onsubmit="return confirm('Confirm payment of this bill?');">
            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="UPI">UPI</option>
                    <option value="Card">Credit / Debit Card</option>
                    <option value="Net Banking">Net Banking</option>
                    <option value="Cash">Cash at Counter</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">
                💳 Pay ₹<span th:text="${bill.totalAmount}"></span>
            </button>
        </form>

        <!-- Print invoice (after payment) -->
        <a th:if="${bill.status == 'Paid'}"
           th:href="@{/customer/bill/{id}/print(id=${bill.id})}"
           class="btn-submit"
           style="display:inline-block;text-decoration:none;">
            🖨️ Print Invoice
        </a>

        <a href="/customer/bills"
           class="btn-cancel">
            Back
        </a>

    </div>

</div>

</body>
</html>
