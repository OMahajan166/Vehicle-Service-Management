<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="logo">🚗 AutoCare Services</div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="form-container">

    <h1>Contact Us</h1>

    <div th:if="${success}"
         class="success-message"
         th:text="${success}">
    </div>

    <form th:action="@{/contact}"
          th:object="${contact}"
          method="post">

        <div class="form-group">
            <label>Name</label>

            <input type="text"
                   th:field="*{name}">

            <small style="color:red"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">
            </small>
        </div>

        <div class="form-group">
            <label>Email</label>

            <input type="email"
                   th:field="*{email}">

            <small style="color:red"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
            </small>
        </div>

        <div class="form-group">
            <label>Phone</label>

            <input type="text"
                   th:field="*{phone}">

            <small style="color:red"
                   th:if="${#fields.hasErrors('phone')}"
                   th:errors="*{phone}">
            </small>
        </div>

        <div class="form-group">
            <label>Message</label>

            <textarea
                    rows="5"
                    th:field="*{message}">
            </textarea>

            <small style="color:red"
                   th:if="${#fields.hasErrors('message')}"
                   th:errors="*{message}">
            </small>
        </div>

        <button type="submit"
                class="btn-submit">
            Send Message
        </button>

    </form>

</div>

</body>
</html>
